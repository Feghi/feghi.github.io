<section class="activity-panel" aria-labelledby="activity-title" data-activity data-current-year="{{ site.time | date: '%Y' }}">
  <div class="section-heading"><div><p class="eyebrow">Small moments, over time</p><h2 id="activity-title">Activity</h2></div>
    <label class="year-picker" hidden>Year <select data-activity-year aria-label="Activity year"></select></label>
  </div>
  <p class="activity-summary" data-activity-summary aria-live="polite">Writing, one day at a time.</p>
  <div class="heatmap-scroll" tabindex="0" role="region" aria-label="Annual activity calendar; scroll horizontally on small screens" hidden>
    <div class="heatmap-months" aria-hidden="true"></div>
    <div class="heatmap-grid" aria-label="Daily post counts"></div>
  </div>
  <div class="activity-key" hidden><span>Each square is a day</span><span>Less <i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i> More</span></div>
  <div class="activity-selection" data-activity-selection hidden aria-live="polite"></div>
  <noscript><p>Enable JavaScript to explore the daily activity calendar. All posts are available in the <a href="{{ '/archive/' | relative_url }}">archive</a>.</p></noscript>
</section>
<script type="application/json" id="activity-posts">[{% for post in site.posts %}{"date":{{ post.date | date: '%Y-%m-%d' | jsonify }},"title":{{ post.title | jsonify | replace: '<', '\u003c' }},"url":{{ post.url | relative_url | jsonify | replace: '<', '\u003c' }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
<script src="{{ '/assets/js/activity.js' | relative_url }}" defer></script>

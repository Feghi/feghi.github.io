{% assign latest_monthly = site.posts | where: 'type', 'monthly' | first %}
{% if latest_monthly %}
<section class="home-monthly" aria-labelledby="monthly-title">
  <div class="monthly-date"><p class="eyebrow">Monthly journal</p><time datetime="{{ latest_monthly.date | date: '%Y-%m' }}">{{ latest_monthly.date | date: '%Y.%m' }}</time><a class="text-link" href="{{ '/monthly/' | relative_url }}">월간 기록 모아보기 ↗</a></div>
  <div class="monthly-copy"><h2 id="monthly-title"><a href="{{ latest_monthly.url | relative_url }}">{{ latest_monthly.title | escape }} <span aria-hidden="true">↗</span></a></h2><p>{{ latest_monthly.description | escape }}</p></div>
</section>
{% endif %}

<figure class="trajectory-explainer" aria-labelledby="trajectory-title trajectory-caption">
  <header><p class="eyebrow">A closer look / k = 2</p><h3 id="trajectory-title">드문 경로를 어떻게 바꿀까?</h3><p>세 경로 중 B를 지나는 경로는 하나뿐이다.</p></header>
  <svg viewBox="0 0 600 240" role="img" aria-labelledby="trajectory-svg-title trajectory-svg-desc">

    <desc id="trajectory-svg-desc">경로 1은 A, B, C를 차례로 지난다. 경로 2와 경로 3은 A에서 C로 간다. B는 점선 원으로 표시되어 있으며 경로 하나에만 등장한다.</desc>
    <g class="trajectory-lines"><path d="M170 48 H490 M170 120 H490 M170 192 H490"/></g>

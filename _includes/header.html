<a class="skip-link" href="#l-main">Skip to content</a>
<header class="archive-header">
  <div class="archive-shell header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">fe.flag<span aria-hidden="true"> /</span></a>
    <nav class="primary-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
      <a href="{{ '/archive/' | relative_url }}" {% if page.url contains '/archive' or page.url contains '/category' or page.url contains '/tag' or page.url contains '/page' %}aria-current="page"{% endif %}>Archive</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research/' %}aria-current="page"{% endif %}>Research</a>
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/lab/' | relative_url }}" {% if page.url contains '/lab/' %}aria-current="page"{% endif %}>Lab</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a>
    </nav>
    {% include theme-toggle.html %}
  </div>
  <div class="archive-shell utility-row">
    <nav aria-label="Browse the archive">
      <a href="{{ '/category/' | relative_url }}">Categories</a>
      <a href="{{ '/tag/' | relative_url }}">Tags</a>
      <a href="{{ '/series/' | relative_url }}">Series</a>
      <a href="{{ '/resume/' | relative_url }}">Resume</a>
    </nav>
    <label class="archive-search"><span class="sr-only">Search posts</span><span aria-hidden="true">⌕</span>
      <input id="search-input" type="search" placeholder="Search the archive…" autocomplete="off">
    </label>
  </div>
</header>
